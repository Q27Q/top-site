<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP物料更新倒计时</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-purple: #7c3aed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 1200px;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            color: var(--text-secondary);
        }

        .tabs {
            display: inline-flex;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 9999px;
            margin-bottom: 3rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }

        .countdown-main {
            font-size: clamp(3rem, 12vw, 10rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(90deg, #ff2200, #ff8800, #ffee00, #22cc44, #1177ff, #22cc44, #ffee00, #ff8800, #ff2200);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 200% center; }
            100% { background-position: 0% center; }
        }

        .countdown-sub {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }

        .label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        .bili-link {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            padding: 10px 24px 10px 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .bili-link:hover {
            background: rgba(0, 161, 214, 0.15);
            border-color: rgba(0, 161, 214, 0.5);
            box-shadow: 0 0 24px rgba(0, 161, 214, 0.25);
            transform: translateY(-2px);
        }

        .bili-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 161, 214, 0.5);
        }

        .bili-info { text-align: left; }

        .bili-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .bili-sub {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 2px;
        }

        .bili-icon {
            width: 22px;
            height: 22px;
            fill: #00a1d6;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .tab-btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>

    <script>
        const targets = [
            { name: "日常角", day: 3, hour: 18, label: "下次更新：周三 18:00" },
            { name: "登神经此处", finished: true, label: "已完结" }
        ];
        let currentIndex = 0;

        function getNextTarget(target) {
            const now  = new Date();
            const next = new Date();
            next.setDate(now.getDate() + (target.day - now.getDay() + 7) % 7);
            next.setHours(target.hour, 0, 0, 0);
            if (next.getTime() <= now.getTime()) next.setDate(next.getDate() + 7);
            return next;
        }

        function updateCountdown() {
            const target = targets[currentIndex];
        
            if (target.finished) {
                document.getElementById('main-time').innerText = "已完结";
                return;
            }
        
            const now = new Date();
            const targetDate = getNextTarget(target);
            const diff = targetDate - now;
            
            if (diff <= 0) {
                document.getElementById('main-time').innerText = "00:00:00";
                document.getElementById('sub-time').innerText  = "0天 00时 00分 00秒";
                return;
            }

            const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const totalH  = days * 24 + hours;

            document.getElementById('main-time').innerText =
                `${String(totalH).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
            document.getElementById('sub-time').innerText =
                `${days}天 ${String(hours).padStart(2,'0')}时 ${String(minutes).padStart(2,'0')}分 ${String(seconds).padStart(2,'0')}秒`;
            document.getElementById('target-label').innerText = targets[currentIndex].label;
        }

        function switchTab(index) {
            currentIndex = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) =>
                btn.classList.toggle('active', i === index));
            updateCountdown();
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
